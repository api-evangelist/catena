aid: catena
name: Catena
description: >-
  Catena (Catena Labs) is building a regulated banking and governance platform for AI
  agents. The platform gives agents verified identities, custodial and non-custodial
  accounts, fiat and stablecoin payment rails across ten chains, yield on idle assets,
  and policy-enforced spending controls. For the humans and businesses deploying those
  agents it is a control plane: set policy, cap spending, restrict counterparties, audit
  every movement, and halt activity when needed. Agents access the platform through an
  API, a CLI, an MCP server, and a Skills framework. Founded by Sean Neville (CEO) and
  Matt Venables (CTO) - both Circle co-founders and creators of USDC - Catena has filed
  for a National Trust Bank charter with the OCC and raised $48M total ($30M Series A
  co-led by a16z crypto and Acrew, with QED, Coinbase Ventures, General Catalyst, Breyer
  Capital, IDG Capital, Oak HC/FT, and Pillar).
